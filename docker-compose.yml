services:
  media-mcp:
    build: .
    image: media-metadata-mcp:local
    container_name: media-mcp
    ports:
      # To expose deliberately, replace 127.0.0.1 with a specific LAN address and
      # configure allowed hostnames below. MCP_AUTH_TOKEN is required either way.
      - "127.0.0.1:${MCP_HTTP_PORT:-3000}:3000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:?TMDB_API_KEY is required}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_PATH=${MCP_HTTP_PATH:-/mcp}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-localhost}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-localhost}
      # The server listens on 0.0.0.0 inside the container, so it refuses to start
      # without a token. Set MCP_AUTH_TOKEN in .env (gitignored), never here:
      #   echo "MCP_AUTH_TOKEN=$(openssl rand -hex 32)" >> .env
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_CACHE_ENABLED=${MCP_CACHE_ENABLED:-true}
      - MCP_CACHE_PATH=/app/cache/cache.db
      - MCP_CACHE_TTL_BOOKS=${MCP_CACHE_TTL_BOOKS:-604800}
      - MCP_CACHE_TTL_MOVIES=${MCP_CACHE_TTL_MOVIES:-86400}
      - MCP_CACHE_TTL_TV=${MCP_CACHE_TTL_TV:-86400}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-media-metadata-mcp}
    volumes:
      - media-mcp-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  media-mcp-cache:
